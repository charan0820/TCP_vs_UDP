experiments:
  protocols: [TCP, UDP]
  packet_sizes: [1024]
  packet_counts: [400]
  duration_seconds: [3]
  rates_mbps: [5]
  repetitions: 2
conditions:
  - {name: clean, delay_ms: 1, loss_percent: 0, bandwidth_mbps: 100}
  - {name: impaired, delay_ms: 1, loss_percent: 2, bandwidth_mbps: 100}
drain_seconds: 5
queue_packets: 100
seed: 42
tcp_algorithm: TcpNewReno
packet_trace_limit: 50000
pcap: true
netanim: false
topology:
  sender: 0
  receiver: 3
  nodes:
    - {id: 0, label: Sender, x: 0, y: 50}
    - {id: 1, label: Router A, x: 33, y: 50}
    - {id: 2, label: Router B, x: 66, y: 50}
    - {id: 3, label: Receiver, x: 100, y: 50}
  links:
    - {source: 0, target: 1, bandwidth_mbps: 100, delay_ms: 1, loss_percent: 0, queue_packets: 100}
    - {source: 1, target: 2, bandwidth_mbps: 2, delay_ms: 10, loss_percent: 0, queue_packets: 30}
    - {source: 2, target: 3, bandwidth_mbps: 100, delay_ms: 1, loss_percent: 0, queue_packets: 100}
