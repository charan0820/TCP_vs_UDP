<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NS-3 packet playback</title>
<style>
:root{font:14px system-ui,sans-serif;color:#183237;background:#f5f4ef;color-scheme:light}
*{box-sizing:border-box}body{margin:0;padding:12px}button,select,input{font:inherit;accent-color:#116466}
button,select{padding:8px 12px;border:1px solid #b7c7be;border-radius:5px;background:#fff;color:#183237}
button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #c76b31;outline-offset:2px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
canvas{width:100%;height:320px;background:#fff;border:1px solid #d4ddd6;border-radius:6px}
input[type=range]{width:100%;margin:12px 0}.muted{color:#516861;font-size:12px;line-height:1.6}
#clock{font:14px ui-monospace,monospace;font-variant-numeric:tabular-nums}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
#details{min-height:28px;font:12px ui-monospace,monospace;margin:10px 0;overflow-wrap:anywhere}
</style>
<div class="controls"><button id="play" aria-label="Play packet recording">Play</button><button id="restart">Restart</button>
<label>Speed <select id="speed"><option value="0.05">0.05×</option><option value="0.1" selected>0.1×</option><option value="0.25">0.25×</option><option value="1">1×</option><option value="5">5×</option></select></label>
<label>Show <select id="filter"><option value="all">All packets</option><option value="DATA">Data</option><option value="ACK">ACK</option><option value="SYN">Handshake</option><option value="drop">Drops</option></select></label><output id="clock" aria-live="off"></output></div>
<canvas id="network" role="img" aria-label="Network topology and packet movement; the event table in the dashboard provides a text alternative"></canvas>
<input id="time" type="range" step="0.0001" aria-label="Simulation time">

const canvas=document.getElementById('network'),ctx=canvas.getContext('2d');
const packets=recording.packets,topology=recording.topology;
const scrub=document.getElementById('time'),play=document.getElementById('play');
let playing=false,now=packets.length?Math.min(...packets.map(p=>p.start)):0,last=0;
const begin=now,finish=packets.length?Math.max(...packets.map(p=>p.end??p.start))+.1:1;
scrub.min=begin;scrub.max=finish;scrub.value=now;
document.getElementById('note').textContent=packets.length?
  `Recorded NS-3 device events. Showing ${packets.length} transmissions/drop markers (capture contains ${recording.total} transmissions). Times are simulation seconds; packet dots and drop flashes are visually enlarged. Capture ${recording.truncated?'hit its configured limit: later events may be missing.':'did not hit its configured limit.'} No path or delivery is invented.`:
  'Topology preview. Run an experiment to record real packet movement. Intermediate nodes forward IPv4 traffic; each link is full duplex.';
function position(node,w,h){
  const xs=topology.nodes.map(n=>n.x),ys=topology.nodes.map(n=>n.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  return [maxX===minX?w/2:65+(node.x-minX)/(maxX-minX)*(w-130),maxY===minY?h/2:70+(node.y-minY)/(maxY-minY)*(h-140)];
}
function matches(p){const f=document.getElementById('filter').value;return f==='all'||(f==='drop'?p.status.includes('drop'):f==='SYN'?p.detail.includes('SYN'):p.detail===f);}
function draw(){
  const ratio=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){canvas.width=w*ratio;canvas.height=h*ratio;}
  ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
  const positions=new Map(topology.nodes.map(n=>[n.id,position(n,w,h)]));
  ctx.font='11px system-ui';ctx.textAlign='center';
  for(const e of topology.links){const a=positions.get(e.source),b=positions.get(e.target);
    ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle='#aebeb7';ctx.lineWidth=2;ctx.stroke();
    const cap=e.bandwidth_mbps??'default',delay=e.delay_ms??'default';
    const text=`${cap} Mbps · ${delay} ms`,x=(a[0]+b[0])/2,y=(a[1]+b[1])/2-14;
    ctx.fillStyle='#fff';ctx.fillRect(x-ctx.measureText(text).width/2-4,y-10,ctx.measureText(text).width+8,15);
    ctx.fillStyle='#516861';ctx.fillText(text,x,y);
  }
  let active=0,latest=null;
  for(const p of packets){
    if(!matches(p)||now<p.start)continue;
    if(!latest||p.start>latest.start)latest=p;
    const end=p.end??p.start;
    if(now>end+.06||active>=200)continue;
    const a=positions.get(p.source),b=positions.get(p.target);
    const fraction=p.status==='queue_drop'||p.end===null?0:Math.min(1,Math.max(0,(now-p.start)/Math.max(.000001,end-p.start)));
    const x=a[0]+(b[0]-a[0])*fraction,y=a[1]+(b[1]-a[1])*fraction;
    const dropped=p.status==='queue_drop'||(p.status==='dropped'&&now>=end);
    ctx.strokeStyle=dropped?'#bf3155':p.detail==='DATA'?'#116466':'#c76b31';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2;
    ctx.beginPath();
    if(dropped){ctx.moveTo(x-6,y-6);ctx.lineTo(x+6,y+6);ctx.moveTo(x+6,y-6);ctx.lineTo(x-6,y+6);ctx.stroke();}
    else{ctx.arc(x,y,5,0,Math.PI*2);if(p.end===null){ctx.setLineDash([2,2]);ctx.stroke();ctx.setLineDash([]);}else ctx.fill();}
    active++;
  }
  for(const n of topology.nodes){const [x,y]=positions.get(n.id);ctx.beginPath();ctx.arc(x,y,19,0,Math.PI*2);
    ctx.fillStyle=n.id===topology.sender?'#116466':n.id===topology.receiver?'#c76b31':'#e7ece7';ctx.fill();
    ctx.fillStyle=n.id===topology.sender||n.id===topology.receiver?'white':'#183237';ctx.font='bold 13px system-ui';ctx.fillText(n.id,x,y+4);
    ctx.fillStyle='#183237';ctx.font='12px system-ui';ctx.fillText(n.label,x,y+38);
  }
  document.getElementById('clock').textContent=now.toFixed(4)+' s';
  document.getElementById('details').textContent=latest?`Latest start: ${latest.protocol} ${latest.detail} · ${latest.source} → ${latest.target} · UID ${latest.uid} · seq ${latest.sequence} · ack ${latest.ack} · ${latest.bytes} bytes · recorded outcome: ${latest.status}`:'No recorded packets at this time.';
}
function frame(timestamp){if(playing){if(last)now=Math.min(finish,now+(timestamp-last)/1000*Number(document.getElementById('speed').value));scrub.value=now;
  if(now>=finish){playing=false;play.textContent='Play';}}last=timestamp;draw();requestAnimationFrame(frame);}
play.onclick=()=>{if(now>=finish)now=begin;playing=!playing;play.textContent=playing?'Pause':'Play';play.setAttribute('aria-label',playing?'Pause packet recording':'Play packet recording');};
document.getElementById('restart').onclick=()=>{now=begin;scrub.value=now;draw();};
scrub.oninput=()=>{now=Number(scrub.value);draw();};
if(!packets.length){play.disabled=true;scrub.disabled=true;}
requestAnimationFrame(frame);
</script></html>
